[ui.toast]
delivery = "system"  # macOS 通知センターへ（ターミナル外でも気づける）

[ui]
show_agent_labels_on_pane_borders = true

[theme]
name = "nord"
auto_switch = false

[theme.custom]
overlay0 = "#6b7a94"  # サイドバーのラベル文字＋未選択ペイン枠（中間トーン）
surface_dim = "#4c566a"  # nord3: サイドバーの区切り線・枠線を可視化（行背景も薄く色付く）

[keys]
split_vertical = ["prefix+v", "prefix+percent"]  # tmux: prefix + %
split_horizontal = ["prefix+minus", "prefix+quote"]  # 既定 + prefix+'（tmux の " は端末依存で不可のため ' を採用）
cycle_pane_next = ["prefix+tab", "prefix+o"]  # 既定 + tmux: prefix + o（次のペイン）
last_pane = "prefix+semicolon"  # tmux: prefix + ;（直前のペイン）

# --- ワークスペースをタブ感覚で操作（旧タブ操作の指づかいを流用） ---
new_workspace      = "prefix+shift+n"                # 素の新規ワークスペース（prefix+c は下のカスタムコマンドへ明け渡した）
next_workspace     = "prefix+n"                      # 次のワークスペース（旧: 次のタブ）
previous_workspace = "prefix+p"                      # 前のワークスペース（旧: 前のタブ）
switch_workspace   = "prefix+1..9"                   # 番号ジャンプ（旧: タブ番号ジャンプ）

# --- 旧タブ操作を退避（衝突回避。タブは当面 shift+c での新規のみ） ---
new_tab      = "prefix+shift+c"  # タブが欲しいときはこちら（prefix+c はカスタムコマンドへ明け渡し）
next_tab     = ""                # 当面無効（必要時に割当）
previous_tab = ""                # 当面無効
switch_tab   = ""                # 当面無効（prefix+1..9 は switch_workspace へ）

# --- カスタムコマンド ---
# prefix+c: fzf でリポジトリを選び、「左 claude / 右ターミナル」のワークスペースを開く。
# 毎回手でやっていた一連の手順を 1 キーに畳んだもの。
# type = "popup"（セッションモーダルの一時ペイン）。popup は寿命がフォーカスに左右され、
# 処理の途中でフォーカスが動くとプロセスごと落ちるが、このコマンドは 0.3 秒で終わり
# フォーカス移動は最後の 1 回だけなので踏まない。
# zsh -ic（対話シェル）なのは PATH（~/bin）を通すため。この環境の zsh 起動ファイルは
# ~/.zshrc だけで、~/.zshenv も ~/.zprofile も無い。zsh は .zshrc を対話シェルでしか
# 読まないので、-lc（ログイン・非対話）では ~/bin に PATH が通らず実行できない。
[[keys.command]]
key = "prefix+c"
type = "popup"
command = "zsh -ic herdr-claude-workspace"
width = "60%"
height = "60%"

[experimental]
pane_history = false
